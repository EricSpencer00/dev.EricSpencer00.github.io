name: Deploy to dev.ericspencer.us

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.html from content/*.txt
        run: python3 scripts/build.py
      - name: Build blog HTML from Markdown
        run: python3 scripts/build_blog.py
      - name: Build resume/CV landing pages
        run: python3 scripts/build_resume_pages.py
      - name: Apply the top nav
        run: python3 scripts/apply_nav.py
      - name: Drop the blog when nothing is published
        run: python3 scripts/prune_blog.py
      - name: Point pages at their link-preview cards
        run: python3 scripts/apply_og_tags.py
      - name: Apply search tags
        run: python3 scripts/seo_tags.py
      - name: Apply GA4 to the dev build
        run: python3 scripts/apply_ga4.py
      - name: Push to dev.EricSpencer00.github.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "dev.ericspencer.us" > CNAME
          # dev.ericspencer.us serves a full copy of the site. Left crawlable it
          # is a duplicate of production competing in search, and its robots.txt
          # was even pointing crawlers at the production sitemap.
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          git add -A CNAME index.html blog robots.txt cv resume assets/pdf assets/og \
            research.html projects.html 404.html projects
          git commit --allow-empty -m "chore: build + set dev CNAME"
          git remote add dev-site "https://x-access-token:${GH_TOKEN}@github.com/EricSpencer00/dev.EricSpencer00.github.io.git"
          git push dev-site HEAD:main --force
