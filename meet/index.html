<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#faf7f2"><meta name="referrer" content="no-referrer"><title>Meet · Eric Spencer</title>
<style>
@font-face{font-family:Jakarta;src:url('/meet/font.woff2') format('woff2');font-weight:200 800;font-display:swap}
:root{--paper:#faf7f2;--ink:#080401;--accent:#5f000b;--dim:#6d6863;--rule:#d6d4d1}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 Jakarta,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:720px;margin:auto;padding:clamp(64px,16vh,160px) 24px 64px}h1{font-size:clamp(42px,7vw,64px);font-weight:700;letter-spacing:-.04em;line-height:1.1;margin:0 0 32px}a{color:var(--accent);text-underline-offset:5px;text-decoration-thickness:1px}a:hover{text-decoration:underline}nav{display:flex;flex-direction:column;align-items:flex-start;gap:8px}nav a{text-decoration:none}.meeting{border-top:1px solid var(--rule);margin-top:48px;padding-top:32px}button,input{font:inherit}button{cursor:pointer}button.primary{border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:var(--paper);padding:13px 21px;font-weight:600}button.primary:hover{background:#430008}button:disabled{cursor:wait;opacity:.6}button.cancel{background:none;border:0;color:var(--dim);padding:12px 0;margin-left:16px}label{display:block;font-weight:600;margin:0 0 8px}input{display:block;width:100%;max-width:380px;padding:12px 14px;border:1px solid #918a83;border-radius:4px;background:#fffdf9;color:var(--ink)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}form{margin-top:28px}small{display:block;max-width:420px;color:var(--dim);font-size:12px;line-height:1.6;margin:16px 0}#challenge{margin:18px 0}#status{max-width:420px;font-size:14px;color:var(--accent)}#result{margin-top:24px}#result a{font-size:20px;font-weight:600}#result:focus{outline:none}[hidden]{display:none!important}@media(max-width:420px){main{padding-top:80px}h1{font-size:42px}.meeting{margin-top:36px}button.primary{width:100%}button.cancel{margin:8px 0 0}input{max-width:none}}
</style></head><body><main><h1>Eric Spencer</h1><nav aria-label="Contact"><a href="mailto:eric@ericspencer.us">eric@ericspencer.us</a><a href="https://cal.com/ericspencer">cal.com/ericspencer</a></nav><section class="meeting" aria-label="Meet on Zoom"><button class="primary" id="open" aria-expanded="false" aria-controls="form">meet with me on zoom</button><form id="form" hidden><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="privacy status"><div id="challenge"></div><small id="privacy">Your email is used only for this request and is not saved. Bot verification is required to show the link. <a href="https://www.cloudflare.com/privacypolicy/">Privacy</a></small><button class="primary" id="submit" type="submit">Get Zoom link</button><button class="cancel" id="cancel" type="button">Cancel</button><p id="status" role="status" aria-live="polite"></p></form><div id="result" tabindex="-1" hidden></div></section></main><script src="/meet/meet.js" defer></script></body></html>
